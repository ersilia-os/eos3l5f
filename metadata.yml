Title: CLAMP contrastive molecule pretraining embedding
Description: CLAMP produces 768 features by training a molecule encoder alongside a language encoder, so that structures and the text describing bioassays are mapped into a shared space. Seidl and colleagues used contrastive learning over assay descriptions paired with active compounds, which lets the model address a new activity task from its written description alone, without task-specific retraining. The embedding is intended for downstream modelling, and its dimensions carry no standalone chemical meaning.
